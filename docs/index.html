<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMPLAN - 防犯カメラ設置図エディタ</title>
<style>
  :root {
    --bg: #060b14;
    --panel: #0b1424;
    --line: #123049;
    --cyan: #00d8ff;
    --cyan-dim: #0a7fa0;
    --amber: #ffbe3c;
    --text: #cfe8f5;
    --muted: #5f8ba3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Consolas", "Roboto Mono", monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0c1626, #081020);
    flex-wrap: wrap;
  }
  header .brand {
    color: var(--cyan);
    letter-spacing: 3px;
    font-weight: bold;
    margin-right: 8px;
    text-shadow: 0 0 12px rgba(0,216,255,.55);
  }
  header .brand small { color: var(--muted); letter-spacing: 0; margin-left: 8px; }
  button, label.filebtn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 5px 12px;
    font: inherit;
    cursor: pointer;
    transition: all .12s;
    user-select: none;
  }
  button:hover, label.filebtn:hover {
    border-color: var(--cyan-dim);
    color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,216,255,.22);
  }
  button.mode.on {
    color: #04222c;
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0,216,255,.6);
  }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #stage canvas { position: absolute; inset: 0; outline: none; }
  #stage.dropping::after {
    content: "図面画像 / 保存ファイル をドロップ";
    position: absolute; inset: 12px;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--cyan);
    color: var(--cyan);
    font-size: 18px;
    background: rgba(0, 30, 45, .55);
    pointer-events: none;
  }
  aside {
    width: 232px;
    border-left: 1px solid var(--line);
    background: var(--panel);
    padding: 12px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  aside h2 {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--cyan-dim);
    border-bottom: 1px solid var(--line);
    padding-bottom: 4px;
    margin: 14px 0 8px;
  }
  aside h2:first-child { margin-top: 0; }
  .props { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
  .props label { color: var(--muted); }
  .props input[type=number] {
    width: 100%;
    background: #061020;
    color: var(--cyan);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 6px;
    font: inherit;
  }
  .props input[type=range] { width: 100%; accent-color: var(--cyan); }
  #pKv { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; }
  #pKv label { color: var(--muted); white-space: nowrap; }
  #pKv input {
    min-width: 0;
    background: #061020;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 3px 5px;
    font: inherit;
  }
  #playerWrap {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .72);
  }
  #playerBox {
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    border-radius: 6px;
    padding: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
    max-width: 92vw;
  }
  #playerHead {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  #playerTitle { color: var(--cyan); flex: 1 1 auto; }
  #playerView {
    width: 768px; max-width: 88vw; aspect-ratio: 16 / 9;
    background: #000;
  }
  #playerMsg { color: var(--muted); margin-top: 6px; min-height: 1.2em; }
  #playerMsg.err { color: #ff8a9a; }
  #navBox { margin-bottom: 4px; }
  .navrow { display: flex; gap: 6px; align-items: center; }
  .navrow select {
    flex: 1 1 auto; min-width: 0;
    padding: 3px 4px;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px;
    font: inherit;
  }
  .navrow button { padding: 3px 8px; }
  #flrList { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  #flrList .row {
    padding: 4px 8px;
    border: 1px solid var(--cyan-dim); border-radius: 4px;
    color: var(--cyan); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #flrList .row.on {
    background: var(--amber); border-color: var(--amber);
    color: #201400; box-shadow: 0 0 10px rgba(255,190,60,.6);
  }
  #navMsg { color: var(--muted); margin-top: 6px; }
  #navMsg.err { color: #ff8a9a; }
  #camList { display: flex; flex-wrap: wrap; gap: 6px; }
  #camList .chip {
    min-width: 30px; text-align: center;
    padding: 3px 6px;
    border: 1px solid var(--cyan-dim);
    border-radius: 999px;
    color: var(--cyan);
    cursor: pointer;
  }
  #camList .chip.on {
    background: var(--amber);
    border-color: var(--amber);
    color: #201400;
    box-shadow: 0 0 10px rgba(255,190,60,.6);
  }
  #noSel { color: var(--muted); }
  #delBtn { width: 100%; margin-top: 8px; border-color: #5a2530; color: #ff8a9a; }
  #delBtn:hover { border-color: #ff5570; box-shadow: 0 0 10px rgba(255,80,110,.3); }
  footer {
    padding: 4px 12px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
  }
</style>
</head>
<body>
<header>
  <span class="brand">CAMPLAN<small>防犯カメラ設置図</small></span>
  <button class="mode on" id="m0">選択</button>
  <button class="mode" id="m1">カメラ追加</button>
  <button class="mode" id="m2">壁</button>
  <button class="mode" id="m3">消去</button>
  <span class="sep"></span>
  <button id="fit">全体表示</button>
  <button id="theme">ライト/ダーク</button>
  <span class="sep"></span>
  <label class="filebtn">下絵を開く<input type="file" id="bgFile" accept="image/*" hidden></label>
  <button id="bgClear">下絵を消す</button>
  <span class="sep"></span>
  <button id="save">ダウンロード</button>
  <label class="filebtn">開く<input type="file" id="openFile" accept=".json,.camplan" hidden></label>
  <button id="png">PNG出力</button>
</header>
<main>
  <div id="stage"><canvas id="view" tabindex="0"></canvas></div>
  <aside>
    <div id="navBox" style="display:none">
      <h2>BUILDING</h2>
      <div class="navrow">
        <select id="bldSel"></select>
        <button id="bldAdd" title="建物を追加">+</button>
        <button id="bldDel" title="この建物を削除">&minus;</button>
      </div>
      <h2>FLOOR</h2>
      <div class="navrow">
        <button id="flrAdd" title="階を追加">+ 階を追加</button>
        <button id="flrDel" title="この階を削除">&minus;</button>
      </div>
      <div id="flrList"></div>
      <div id="navMsg"></div>
    </div>
    <h2>SELECTED CAMERA</h2>
    <div id="selBox" style="display:none">
      <div class="props">
        <label>番号</label><input type="number" id="pNo" min="1" max="99">
        <label>方向°</label><input type="number" id="pDir" min="0" max="359" step="1">
        <label>画角°</label><input type="range" id="pFov" min="10" max="359" step="1">
        <label></label><input type="number" id="pFovN" min="10" max="359" step="1">
        <label>距離</label><input type="range" id="pRange" min="24" max="2000" step="1">
        <label></label><input type="number" id="pRangeN" min="24" max="4000" step="1">
      </div>
      <h2>PROPERTIES</h2>
      <div id="pKv"></div>
      <button id="delBtn">このカメラを削除</button>
    </div>
    <div id="noSel">カメラをクリックで選択</div>
    <h2>CAMERAS</h2>
    <div id="camList"></div>
    <h2>DISPLAY</h2>
    <div class="props">
      <label>マーカー</label><input type="range" id="pMarker" min="6" max="80" step="1">
      <label></label><input type="number" id="pMarkerN" min="6" max="80" step="1">
    </div>
  </aside>
</main>
<div id="playerWrap">
  <div id="playerBox">
    <div id="playerHead">
      <span id="playerTitle"></span>
      <button id="playerClose">閉じる</button>
    </div>
    <div id="playerView"></div>
    <div id="playerMsg"></div>
  </div>
</div>
<footer id="hint">V:選択 C:カメラ W:壁 E:消去 F:全体 Ctrl+Z:戻す Ctrl+Y:やり直し Del:削除 / 追加: クリック→ドラッグで向き / 壁: クリックで頂点、Enterで確定 / ホイール: ズーム</footer>

<script src="camplan.js?v=20260914021501"></script>
<script>
createCamplan().then(function (M) {
  'use strict';
  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var lastW = 0, lastH = 0;
  var panelStale = true;

  function fit() {
    var r = stage.getBoundingClientRect();
    var w = Math.max(Math.floor(r.width), 100);
    var h = Math.max(Math.floor(r.height), 100);
    if (w === lastW && h === lastH) return;
    canvas.width = w; canvas.height = h;
    if (lastW) M._cp_resize(w, h); else M._cp_init(w, h);
    lastW = w; lastH = h;
  }
  fit();
  new ResizeObserver(fit).observe(stage);

  function present() {
    var ptr = M._cp_render();
    var img = new ImageData(
        new Uint8ClampedArray(M.HEAPU8.buffer, ptr, lastW * lastH * 4)
            .slice(), lastW, lastH);
    ctx.putImageData(img, 0, 0);
  }

  /* ------------------------------------------------------------ panel */
  var selBox = document.getElementById('selBox');
  var noSel = document.getElementById('noSel');
  var camList = document.getElementById('camList');
  var pNo = document.getElementById('pNo');
  var pDir = document.getElementById('pDir');
  var pFov = document.getElementById('pFov');
  var pFovN = document.getElementById('pFovN');
  var pRange = document.getElementById('pRange');
  var pRangeN = document.getElementById('pRangeN');

  /* Camera properties.  Strings cross the boundary as UTF-8 on the wasm
     heap, so every one of them has to be freed again. */
  var pKv = document.getElementById('pKv');
  var kvShown = null;   // what the rows currently show, to avoid rebuilding

  function withStrings(fn, strings) {
    var ptrs = strings.map(function (s) { return M.stringToNewUTF8(s); });
    try { return fn.apply(null, ptrs); }
    finally { ptrs.forEach(function (p) { M._cp_free(p); }); }
  }
  function readProps() {
    var rows = [];
    for (var i = 0, n = M._cp_sel_prop_count(); i < n; i++)
      rows.push([M.UTF8ToString(M._cp_sel_prop_key(i)),
                 M.UTF8ToString(M._cp_sel_prop_value(i))]);
    return rows;
  }
  function cameraProps(no) {
    if (!no) return {};
    try { return JSON.parse(M.UTF8ToString(M._cp_camera_props(no))); }
    catch (err) { return {}; }
  }
  // カメラのプロパティは固定 4 項目。C++ 側は任意のキーを持てるが、
  // UI からはこの 4 つだけを読み書きする（他のキーがあっても壊さない）。
  var PROP_FIELDS = [
    { key: 'name',      label: '名前' },
    { key: 'device_id', label: 'デバイスID' },
    { key: 'api_key',   label: 'APIキー' },
    { key: 'comment',   label: 'コメント' }
  ];
  var propInputs = null;

  function buildPropRows() {
    propInputs = {};
    pKv.innerHTML = '';
    PROP_FIELDS.forEach(function (f) {
      var lab = document.createElement('label');
      lab.textContent = f.label;
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.title = f.label;
      inp.onchange = function () {
        withStrings(M._cp_sel_set_prop, [f.key, inp.value]);
        kvShown = null;
        panelStale = true;
        touch();     // 絵が変わらない編集なので cp_dirty では拾えない
      };
      pKv.appendChild(lab);
      pKv.appendChild(inp);
      propInputs[f.key] = inp;
    });
  }

  function refreshProps(no) {
    var rows = readProps();
    var sig = JSON.stringify([no, rows]);
    if (sig === kvShown) return;
    // Never pull the values out from under someone who is typing in them.
    if (pKv.contains(document.activeElement)) return;
    kvShown = sig;
    if (!propInputs) buildPropRows();
    var map = {};
    rows.forEach(function (row) { map[row[0]] = row[1]; });
    PROP_FIELDS.forEach(function (f) { propInputs[f.key].value = map[f.key] || ''; });
  }

  function refreshPanel() {
    var no = M._cp_sel_number();
    selBox.style.display = no ? '' : 'none';
    noSel.style.display = no ? 'none' : '';
    if (no) {
      if (document.activeElement !== pNo) pNo.value = no;
      if (document.activeElement !== pDir)
        pDir.value = Math.round(M._cp_sel_dir());
      var fov = Math.round(M._cp_sel_fov());
      var range = Math.round(M._cp_sel_range());
      pFov.value = fov;
      if (document.activeElement !== pFovN) pFovN.value = fov;
      pRange.value = range;
      if (document.activeElement !== pRangeN) pRangeN.value = range;
      refreshProps(no);
    }
    var n = M._cp_camera_count();
    var want = [];
    for (var i = 0; i < n; i++) want.push(M._cp_camera_number_at(i));
    want.sort(function (a, b) { return a - b; });
    camList.innerHTML = '';
    want.forEach(function (num) {
      var chip = document.createElement('span');
      chip.className = 'chip' + (num === no ? ' on' : '');
      chip.textContent = num;
      chip.onclick = function () { M._cp_select_number(num); panelStale = true; };
      camList.appendChild(chip);
    });
    var marker = Math.round(M._cp_get_marker());
    pMarker.value = marker;
    if (document.activeElement !== pMarkerN) pMarkerN.value = marker;
    panelStale = false;
  }

  pNo.onchange = function () {
    if (!M._cp_sel_set_number(parseInt(pNo.value, 10) || 0))
      pNo.value = M._cp_sel_number();
    panelStale = true;
  };
  pDir.onchange = function () { M._cp_sel_set_dir(parseFloat(pDir.value) || 0); };
  function setFov(v) { M._cp_sel_set_fov(parseFloat(v) || 90); panelStale = true; }
  function setRange(v) { M._cp_sel_set_range(parseFloat(v) || 200); panelStale = true; }
  pFov.oninput = function () { setFov(pFov.value); };
  pFovN.onchange = function () { setFov(pFovN.value); };
  pRange.oninput = function () { setRange(pRange.value); };
  pRangeN.onchange = function () { setRange(pRangeN.value); };
  var pMarker = document.getElementById('pMarker');
  var pMarkerN = document.getElementById('pMarkerN');
  function setMarker(v) {
    M._cp_set_marker(parseFloat(v) || 16);
    panelStale = true;
  }
  pMarker.oninput = function () { setMarker(pMarker.value); };
  pMarkerN.onchange = function () { setMarker(pMarkerN.value); };
  document.getElementById('delBtn').onclick = function () {
    M._cp_delete_selected();
    panelStale = true;
  };

  /* ------------------------------------------------------------- modes */
  var modeButtons = [0, 1, 2, 3].map(function (i) {
    var b = document.getElementById('m' + i);
    b.onclick = function () { setMode(i); };
    return b;
  });
  function setMode(i) {
    M._cp_set_mode(i);
    shownMode = i;
    modeButtons.forEach(function (b, k) {
      b.classList.toggle('on', k === i);
    });
    canvas.focus();
  }
  document.getElementById('fit').onclick = function () {
    M._cp_zoom_fit();
    canvas.focus();
  };
  var darkTheme = true;
  document.getElementById('theme').onclick = function () {
    darkTheme = !darkTheme;
    M._cp_set_theme(darkTheme ? 0 : 1);
    document.body.style.filter = '';
  };

  /* ------------------------------------------------------------- input */
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    canvas.focus();
    var p = pos(e);
    M._cp_mouse_down(p[0], p[1], e.button);
    panelStale = true;
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pos(e);
    M._cp_mouse_move(p[0], p[1]);
    if (e.buttons) panelStale = true;
  });
  canvas.addEventListener('pointerup', function (e) {
    var p = pos(e);
    M._cp_mouse_up(p[0], p[1], e.button);
    panelStale = true;
  });
  canvas.addEventListener('wheel', function (e) {
    var p = pos(e);
    M._cp_wheel(p[0], p[1], e.deltaY);
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // A double click on a camera hands its number and its properties to the
  // page - the hook for opening that camera's live video.  Replace
  // window.onCameraOpen (or listen for the 'camplan:camera' event) to wire in
  // the real player.
  canvas.addEventListener('dblclick', function (e) {
    var p = pos(e);
    var no = M._cp_camera_at(p[0], p[1]);
    if (!no) return;
    var props = cameraProps(no);
    window.dispatchEvent(new CustomEvent('camplan:camera',
        { detail: { number: no, props: props } }));
    if (window.onCameraOpen) window.onCameraOpen(no, props);
    else if (props.device_id && props.api_key) openPlayer(no, props);
    else alert('カメラ ' + no + ' にデバイスIDとAPIキーを設定すると映像が見られます');
    e.preventDefault();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && playerWrap.style.display === 'flex') {
      closePlayer();
      e.preventDefault();
      return;
    }
    if (e.target.tagName === 'INPUT') return;
    if (e.ctrlKey || e.metaKey) {
      var k = e.key.toLowerCase();
      if (k === 'z' && e.shiftKey) { M._cp_redo(); }
      else if (k === 'z') { M._cp_undo(); }
      else if (k === 'y') { M._cp_redo(); }
      else if (k === 's') { document.getElementById('save').click(); }
      else return;
      panelStale = true;
      e.preventDefault();
      return;
    }
    var modes = { v: 0, '1': 0, c: 1, '2': 1, w: 2, '3': 2, e: 3, '4': 3 };
    var k = e.key.toLowerCase();
    if (k in modes) { setMode(modes[k]); return; }
    if (k === 'f') { M._cp_zoom_fit(); return; }
    var codes = { Delete: 46, Backspace: 8, Enter: 13, Escape: 27 };
    if (codes[e.key]) {
      M._cp_key(codes[e.key]);
      panelStale = true;
      e.preventDefault();
    }
  });

  /* -------------------------------------------------------- background */
  // The file goes to C++ as-is: the wasm side decodes it (stb_image) and keeps
  // the compressed bytes for saving, so the page never touches pixels here.
  function loadImageFile(file, name) {
    var fileName = name || file.name || 'image';
    return file.arrayBuffer().then(function (buf) {
      var bytes = new Uint8Array(buf);
      var fp = M._cp_alloc(bytes.length);
      M.HEAPU8.set(bytes, fp);
      var nameBytes = new TextEncoder().encode(fileName + '\0');
      var np = M._cp_alloc(nameBytes.length);
      M.HEAPU8.set(nameBytes, np);
      var ok = M._cp_set_background(fp, bytes.length, np);
      M._cp_free(fp); M._cp_free(np);
      if (!ok) alert('この画像は読めませんでした（PNG / JPEG / BMP、3200万画素まで）');
      panelStale = true;
    });
  }
  document.getElementById('bgFile').onchange = function (e) {
    if (e.target.files[0]) loadImageFile(e.target.files[0]);
    e.target.value = '';
  };
  document.getElementById('bgClear').onclick = function () {
    M._cp_clear_background();
  };

  /* ------------------------------------------------------- save / load */
  function download(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }
  // 文字列のやりとりは loadJsonFile と同じ手（alloc して HEAPU8 に置く）。
  // lengthBytesUTF8 は EXPORTED_RUNTIME_METHODS に入っていないので使わない。
  function currentJson() {
    var ptr = M._cp_save();
    var size = M._cp_save_size();
    return new TextDecoder().decode(new Uint8Array(M.HEAPU8.buffer, ptr, size));
  }
  function loadJsonText(text) {
    var bytes = new TextEncoder().encode(text);
    var p = M._cp_alloc(bytes.length);
    M.HEAPU8.set(bytes, p);
    var ok = M._cp_load(p, bytes.length);
    M._cp_free(p);
    if (ok) panelStale = true;
    return !!ok;
  }
  document.getElementById('save').onclick = function () {
    download(new Blob([currentJson()], { type: 'application/json' }),
             (curBld ? curBld + '_' + curFlr : 'camplan') + '.json');
  };
  function loadJsonFile(file) {
    file.arrayBuffer().then(function (buf) {
      var bytes = new Uint8Array(buf);
      var p = M._cp_alloc(bytes.length);
      M.HEAPU8.set(bytes, p);
      var ok = M._cp_load(p, bytes.length);
      M._cp_free(p);
      // The embedded background comes back with the document - the wasm side
      // decodes it while loading, so there is nothing left to do here.
      if (!ok) { alert('このファイルは読めませんでした'); return; }
      panelStale = true;
    });
  }
  document.getElementById('openFile').onchange = function (e) {
    if (e.target.files[0]) loadJsonFile(e.target.files[0]);
    e.target.value = '';
  };

  /* ----------------------------------------------------- safie player

     カメラのプロパティに device_id と api_key が両方入っていれば、
     ダブルクリックで Safie SDK の映像を出す。SDK はそのとき初めて
     読み込む（単体・オフラインでの起動を重くしないため）。

     ページ側が window.onCameraOpen を定義していればそちらが優先される
     ので、別のプレーヤーを差し込みたいときは従来どおりにできる。       */

  var SAFIE_SDK_URL = 'https://safie.link/sdk/js/api/v1/latest/';
  var sdkLoading = null;
  var player = null;
  var playerWrap = document.getElementById('playerWrap');
  var playerView = document.getElementById('playerView');
  var playerTitle = document.getElementById('playerTitle');
  var playerMsg = document.getElementById('playerMsg');

  function loadSafieSdk() {
    if (window.Safie) return Promise.resolve();
    if (sdkLoading) return sdkLoading;
    sdkLoading = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = SAFIE_SDK_URL;
      s.onload = function () {
        window.Safie ? resolve() : reject(new Error('SDK を読み込めませんでした'));
      };
      s.onerror = function () { reject(new Error('SDK を読み込めませんでした')); };
      document.head.appendChild(s);
    });
    sdkLoading.catch(function () { sdkLoading = null; });   // 次回やり直せるように
    return sdkLoading;
  }

  function stopPlayer() {
    if (player && player.stop) {
      try { player.stop(); } catch (e) { /* 停止できなくても閉じる */ }
    }
    player = null;
    playerView.innerHTML = '';
  }

  function closePlayer() {
    stopPlayer();
    playerWrap.style.display = 'none';
    playerMsg.textContent = '';
    playerMsg.className = '';
  }

  document.getElementById('playerClose').onclick = closePlayer;
  playerWrap.addEventListener('click', function (e) {
    if (e.target === playerWrap) closePlayer();   // 外側をクリックで閉じる
  });

  function openPlayer(no, props) {
    var deviceId = props.device_id || '';
    var apiKey = props.api_key || '';
    var name = props.name || '';
    stopPlayer();
    playerWrap.style.display = 'flex';
    playerTitle.textContent = 'カメラ ' + no + (name ? ' - ' + name : '');
    playerMsg.textContent = '接続中…';
    playerMsg.className = '';
    loadSafieSdk().then(function () {
      return Safie.Auth.setToken(apiKey, 'apiKey');
    }).then(function () {
      player = new Safie.Player.StreamingPlayer(playerView);
      player.deviceId = deviceId;
      return player.play();
    }).then(function () {
      playerMsg.textContent = '';
    }).catch(function (e) {
      playerMsg.textContent = '映像を再生できませんでした: ' + ((e && e.message) || e);
      playerMsg.className = 'err';
      console.error('safie player:', e);
    });
  }

  /* ------------------------------------------------- buildings / floors

     ページ側が window.camplanStorage を用意したときだけ有効になる。
     camplan 自身は保存先が何かを知らない（KV でもファイルでも良い）。

       list()          -> Promise<[{key, size}]>   key は "建物名/階名"
       load(key)       -> Promise<string>          保存 JSON
       save(key, json) -> Promise<void>
       remove(key)     -> Promise<void>

     建物と階はキーそのものから組み立てる。階を持たない建物は存在しない
     （建物を作ると 1F が自動でできる）。保存は自動 — 編集が止まってから
     少し待って、中身が変わっていれば書き戻す。                         */

  var store = window.camplanStorage || null;
  var DEFAULT_BUILDING = 'サンプル株式会社';
  var DEFAULT_FLOOR = '1F';
  var AUTOSAVE_IDLE_MS = 1500;
  var DEMO_IMAGE = 'cocololo.jpg';   // 既定の階に入れる見本の図面

  var navBox = document.getElementById('navBox');
  var bldSel = document.getElementById('bldSel');
  var flrList = document.getElementById('flrList');
  var navMsg = document.getElementById('navMsg');

  var tree = {};          // { 建物名: [階名, ...] }
  var curBld = null;
  var curFlr = null;
  var syncedJson = null;  // 最後に保存/読込した JSON。変化の判定に使う
  var saveTimer = null;
  var saving = false;
  var busy = false;       // 読み込み・作成・削除の最中は自動保存を止める

  function keyOf(b, f) { return b + '/' + f; }
  function splitKey(k) {
    var i = k.indexOf('/');
    return (i <= 0 || i === k.length - 1) ? null : [k.slice(0, i), k.slice(i + 1)];
  }
  function say(text, cls) {
    navMsg.textContent = text || '';
    navMsg.className = cls || '';
  }
  function fail(e) { busy = false; say((e && e.message) || String(e), 'err'); }

  function buildTree(items) {
    tree = {};
    (items || []).forEach(function (it) {
      var kv = splitKey(it.key);
      if (!kv) return;                      // "/" を含まないキーは建物/階ではない
      (tree[kv[0]] = tree[kv[0]] || []).push(kv[1]);
    });
    Object.keys(tree).forEach(function (b) { tree[b].sort(); });
  }

  function renderNav() {
    bldSel.innerHTML = '';
    Object.keys(tree).sort().forEach(function (b) {
      var o = document.createElement('option');
      o.value = b;
      o.textContent = b;
      if (b === curBld) o.selected = true;
      bldSel.appendChild(o);
    });
    flrList.innerHTML = '';
    (tree[curBld] || []).forEach(function (f) {
      var row = document.createElement('div');
      row.className = 'row' + (f === curFlr ? ' on' : '');
      row.textContent = f;
      row.onclick = function () { selectFloor(curBld, f); };
      flrList.appendChild(row);
    });
  }

  /* ---- 自動保存 ---- */

  // 編集が止まってから書き戻す。図面画像を含む JSON を毎回作るのは重いので、
  // 描画が更新された（= 何か操作があったかもしれない）ときだけ動かす。
  function touch() {
    if (!store || !curBld || !curFlr || busy) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(autoSave, AUTOSAVE_IDLE_MS);
  }

  function autoSave() {
    if (!store || !curBld || !curFlr || busy || saving) return;
    var json = currentJson();
    if (json === syncedJson) return;        // 見た目が動いただけ（パン/ズーム等）
    var key = keyOf(curBld, curFlr);
    saving = true;
    say('保存中…');
    store.save(key, json).then(function () {
      saving = false;
      syncedJson = json;
      say(key + ' に保存しました');
    }).catch(function (e) { saving = false; fail(e); });
  }

  // 切り替え・削除の前に、溜まっている変更を確実に書き戻す
  function flush() {
    if (!store || !curBld || !curFlr) return Promise.resolve();
    clearTimeout(saveTimer);
    var json = currentJson();
    if (json === syncedJson) return Promise.resolve();
    var key = keyOf(curBld, curFlr);
    return store.save(key, json).then(function () { syncedJson = json; });
  }

  /* ---- 操作 ---- */

  function selectFloor(b, f) {
    if (b === curBld && f === curFlr) return Promise.resolve();
    busy = true;
    say('読み込み中…');
    return flush().then(function () {
      return store.load(keyOf(b, f));
    }).then(function (json) {
      if (!json || !loadJsonText(json)) throw new Error('この階のデータは読めませんでした');
      curBld = b; curFlr = f; syncedJson = json;
      busy = false;
      renderNav();
      say('');
    }).catch(function (e) {
      // 1つの階が読めないだけでリストごと消えると何が起きたか分からない
      if (!curBld) curBld = b;
      renderNav();
      fail(e);
    });
  }

  // 空の図面の JSON。新しい階はこれで作る。
  // "app":"camplan" が無い JSON は Document::fromJson が受け付けない
  // （読めなかったとき書類を壊さないための作り）。これを外すと cp_load が
  // 黙って失敗して、今開いている図面がそのまま新しい階に複製される。
  var EMPTY_DOC = '{"app":"camplan","version":1,"walls":[],"cameras":[]}';
  function emptyJson() {
    var keep = currentJson();
    if (!loadJsonText(EMPTY_DOC)) return EMPTY_DOC;   // 念のため
    var empty = currentJson();
    loadJsonText(keep);
    return empty;
  }

  function askName(title) {
    var s = prompt(title, '');
    if (s === null) return null;
    s = s.trim();
    if (!s) { say('名前を入力してください', 'err'); return null; }
    if (s.indexOf('/') >= 0) { say('名前に / は使えません', 'err'); return null; }
    return s;
  }

  // 見本の図面を今の書類に読み込む。無くても（file://、オフライン、配り忘れ）
  // 白紙で続けられるので、失敗は握りつぶす。
  function loadDemoBackground() {
    return fetch(DEMO_IMAGE).then(function (r) {
      return r.ok ? r.blob() : null;
    }).then(function (blob) {
      return blob ? loadImageFile(blob, DEMO_IMAGE) : null;
    }).catch(function () { });
  }

  // demo = true のときだけ見本の図面入りで作る。使うのは一番最初の
  // サンプル株式会社/1F だけで、利用者が足す建物・階は白紙から始める。
  function createFloor(b, f, demo) {
    return (demo ? loadDemoBackground() : Promise.resolve()).then(function () {
      var json = demo ? currentJson() : emptyJson();
      return store.save(keyOf(b, f), json).then(function () {
        (tree[b] = tree[b] || []).push(f);
        tree[b].sort();
        curBld = b; curFlr = f; syncedJson = json;
        loadJsonText(json);
        busy = false;
        renderNav();
        say(keyOf(b, f) + ' を作りました');
      });
    });
  }

  document.getElementById('bldAdd').onclick = function () {
    var name = askName('建物名');
    if (name === null) return;
    if (tree[name]) { say('その建物はすでにあります', 'err'); return; }
    busy = true;
    say('作成中…');
    flush().then(function () { return createFloor(name, DEFAULT_FLOOR); }).catch(fail);
  };

  document.getElementById('bldDel').onclick = function () {
    if (!curBld) return;
    if (Object.keys(tree).length <= 1) { say('最後の建物は削除できません', 'err'); return; }
    var gone = curBld;
    var floors = (tree[gone] || []).slice();
    if (!confirm(gone + ' を階ごと削除します（' + floors.length + '階）。よろしいですか？')) return;
    busy = true;
    clearTimeout(saveTimer);
    say('削除中…');
    Promise.all(floors.map(function (f) { return store.remove(keyOf(gone, f)); }))
      .then(function () {
        delete tree[gone];
        curBld = null; curFlr = null; syncedJson = null;
        busy = false;
        var next = Object.keys(tree).sort()[0];
        return selectFloor(next, tree[next][0]);
      })
      .then(function () { say(gone + ' を削除しました'); })
      .catch(fail);
  };

  document.getElementById('flrAdd').onclick = function () {
    if (!curBld) return;
    var name = askName('階名');
    if (name === null) return;
    if ((tree[curBld] || []).indexOf(name) >= 0) { say('その階はすでにあります', 'err'); return; }
    var b = curBld;
    busy = true;
    say('作成中…');
    flush().then(function () { return createFloor(b, name); }).catch(fail);
  };

  document.getElementById('flrDel').onclick = function () {
    if (!curBld || !curFlr) return;
    var floors = tree[curBld] || [];
    if (floors.length <= 1) {
      say('最後の階は削除できません（建物ごと削除してください）', 'err');
      return;
    }
    var b = curBld, f = curFlr;
    if (!confirm(keyOf(b, f) + ' を削除します。よろしいですか？')) return;
    busy = true;
    clearTimeout(saveTimer);
    say('削除中…');
    store.remove(keyOf(b, f)).then(function () {
      tree[b] = floors.filter(function (x) { return x !== f; });
      curFlr = null; syncedJson = null;
      busy = false;
      return selectFloor(b, tree[b][0]);
    }).then(function () { say(keyOf(b, f) + ' を削除しました'); }).catch(fail);
  };

  bldSel.onchange = function () {
    var b = bldSel.value;
    if (b === curBld) return;
    selectFloor(b, tree[b][0]);
  };

  function initStorage() {
    if (!store) return;                     // 単体動作。従来どおりファイル入出力のみ
    navBox.style.display = '';
    busy = true;
    say('読み込み中…');
    store.list().then(function (items) {
      buildTree(items);
      var blds = Object.keys(tree).sort();
      if (!blds.length) {
        // 何も無いところに作る最初の1枚。白紙だと何をする画面か分からないので
        // 見本の図面を入れておく。
        return createFloor(DEFAULT_BUILDING, DEFAULT_FLOOR, true)
          .then(function () { say(''); });
      }
      busy = false;
      return selectFloor(blds[0], tree[blds[0]][0]);
    }).catch(function (e) {
      // ここに来るのは camplanStorage が居るのに使えなかったとき。黙って
      // 引っ込めると「機能が無い」のか「繋がっていない」のか分からないので、
      // パネルは出したまま理由を書く。保存はできないので自動保存は止める。
      store = null;
      busy = false;
      renderNav();
      say('保存先に接続できません: ' + ((e && e.message) || e) +
          '（ダウンロードと「開く」は使えます）', 'err');
      console.warn('camplanStorage is unavailable:', e);
    });
  }

  /* -------------------------------------------------------------- drop */
  ['dragover', 'dragenter'].forEach(function (t) {
    stage.addEventListener(t, function (e) {
      e.preventDefault();
      stage.classList.add('dropping');
    });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    stage.addEventListener(t, function (e) {
      e.preventDefault();
      stage.classList.remove('dropping');
    });
  });
  stage.addEventListener('drop', function (e) {
    var file = e.dataTransfer.files[0];
    if (!file) return;
    if (/\.(json|camplan)$/i.test(file.name)) loadJsonFile(file);
    else loadImageFile(file);
  });

  /* ---------------------------------------------------------- PNG out */
  document.getElementById('png').onclick = function () {
    var ptr = M._cp_export_render();
    var w = M._cp_export_w(), h = M._cp_export_h();
    var img = new ImageData(
        new Uint8ClampedArray(M.HEAPU8.buffer, ptr, w * h * 4).slice(), w, h);
    var off = document.createElement('canvas');
    off.width = w; off.height = h;
    off.getContext('2d').putImageData(img, 0, 0);
    off.toBlob(function (blob) { download(blob, 'camplan.png'); }, 'image/png');
  };

  /* -------------------------------------------------------------- loop */
  var shownMode = 0;
  var shownSel = 0;
  function frame() {
    fit();
    var m = M._cp_get_mode();
    if (m !== shownMode) {
      shownMode = m;
      modeButtons.forEach(function (b, k) { b.classList.toggle('on', k === m); });
    }
    // Selecting a camera - by click, by chip, by keyboard - hands the same
    // { number, props } object to the page.  0 means nothing is selected now.
    var sel = M._cp_sel_number();
    if (sel !== shownSel) {
      shownSel = sel;
      var detail = { number: sel, props: cameraProps(sel) };
      window.dispatchEvent(new CustomEvent('camplan:select',
                                           { detail: detail }));
      if (window.onCameraSelect) window.onCameraSelect(sel, detail.props);
    }
    if (M._cp_dirty()) {
      present();
      touch();             // 何か操作があった -> 自動保存のタイマを延ばす
      if (panelStale !== false) refreshPanel();
      panelStale = true;   // handle drags updating fov/range live
    }
    if (panelStale) refreshPanel();
    requestAnimationFrame(frame);
  }
  M._cp_set_theme(0);
  initStorage();
  // The demo plan, so the first visit has something to point cameras at.
  // A failure (file://, offline) just leaves the graph paper.
  // With storage the floor's own document is the starting point, so skip it.
  if (!store) fetch(DEMO_IMAGE).then(function (r) {
    return r.ok ? r.blob() : null;
  }).then(function (blob) {
    if (blob && !M._cp_camera_count() && !M._cp_bg_size())
      loadImageFile(blob, DEMO_IMAGE);
  }).catch(function () {});
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
